<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 90">
  <!-- The cities pack's backdrop: Qız qalası (the Maiden Tower) and the wall of İçərişəhər in Baku, by the Caspian. Elifba own art, MIT. -->
  <!-- 16:9 and low contrast so cards stay readable: the colours of ADR 014's guide mixed with white, no outline, light from the top left; the tower and wall stay in the bottom fifth (y 72–90). -->
  <defs>
    <linearGradient id="qiz-qalasi_sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E4F4FF"/><stop offset="0.85" stop-color="#FBFEFF"/></linearGradient>
    <radialGradient id="qiz-qalasi_glow" cx="0.06" cy="0" r="0.6"><stop offset="0" stop-color="#FFFDE5" stop-opacity="0.85"/><stop offset="1" stop-color="#FFFDE5" stop-opacity="0"/></radialGradient>
    <linearGradient id="qiz-qalasi_cloud" x1="0" y1="0" x2="0" y2="1"><stop offset="0.3" stop-color="#FFFFFF" stop-opacity="0.95"/><stop offset="1" stop-color="#E5E1F6" stop-opacity="0.85"/></linearGradient>
    <filter id="qiz-qalasi_blur" x="-0.5" y="-0.5" width="2" height="2"><feGaussianBlur stdDeviation="0.35"/></filter>
    <linearGradient id="qiz-qalasi_sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DCFAFF"/><stop offset="1" stop-color="#D3F0FF"/></linearGradient>
    <radialGradient id="qiz-qalasi_back" cx="0.3" cy="0.1" r="1"><stop stop-color="#FFFCDA"/><stop offset="0.5" stop-color="#FEF4DB"/><stop offset="1" stop-color="#F4EAD7"/></radialGradient>
    <radialGradient id="qiz-qalasi_wall" cx="0.3" cy="0.1" r="1"><stop stop-color="#FFFBC8"/><stop offset="0.5" stop-color="#FDEFCA"/><stop offset="1" stop-color="#EEE0C3"/></radialGradient>
    <linearGradient id="qiz-qalasi_tower" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFAB5"/><stop offset="0.45" stop-color="#FCEAB8"/><stop offset="1" stop-color="#E9D5AF"/></linearGradient>
    <linearGradient id="qiz-qalasi_buttress" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FCEAB8"/><stop offset="1" stop-color="#E9D5AF"/></linearGradient>
    <filter id="qiz-qalasi_soft" x="-0.5" y="-0.5" width="2" height="2"><feGaussianBlur stdDeviation="0.4"/></filter>
